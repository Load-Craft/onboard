name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mcp:
    name: mcp (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:skills
      - run: npm run build
      - run: npm run check:dist
      # The two generated clients are checked apart, and each runs even when an earlier step failed,
      # so one run shows which client is stale.
      - name: check REST client
        if: ${{ !cancelled() }}
        run: npm run check:api
      - name: check WebSocket client
        if: ${{ !cancelled() }}
        run: npm run check:ws
